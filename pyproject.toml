[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "reshelf"
version = "0.1.0"
description = "Organize large collections of EPUB/PDF ebooks"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "pydantic>=2.7",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "rich>=13.0",
    "rapidfuzz>=3.0",
    "pymupdf>=1.24",
    "mobi>=0.3",            # GPL-3.0; self-hosted only, see the spec
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sse-starlette>=2.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
reshelf = "reshelf.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/reshelf"]

[tool.pytest.ini_options]
testpaths = ["tests"]
