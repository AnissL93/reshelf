[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "reshelf"
version = "0.1.0"
description = "Organize large collections of EPUB/PDF ebooks"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "pydantic>=2.7",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "rich>=13.0",
    "rapidfuzz>=3.0",
    "pymupdf>=1.24",
    "mobi>=0.3",            # GPL-3.0; self-hosted only, see the spec
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sse-starlette>=2.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-timeout>=2.3"]

[project.scripts]
reshelf = "reshelf.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/reshelf"]
artifacts = ["src/reshelf/web/static/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# A global backstop so a hung test fails the run instead of blocking it
# forever - generous enough that no legitimate test should ever trip it.
# Streaming tests set a tighter @pytest.mark.timeout on top of this.
timeout = 60
# "signal" (the default) relies on a signal handler being able to interrupt
# whatever the main thread is blocked in, and cannot: reproduced with a
# genuinely hung SSE stream, where the main thread blocks inside
# anyio.from_thread's Future.result() (a Condition.wait()) - "signal" printed
# a thread dump but never actually aborted the test; "thread" (a watchdog
# thread that hard-exits the process) did, in ~2s. This suite's SSE tests
# are exactly this shape, so "thread" is the one that actually protects it.
timeout_method = "thread"
